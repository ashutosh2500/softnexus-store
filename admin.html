<!DOCTYPE html>
<html>
<head>
<title>SoftNexus Admin</title>
<style>
body{font-family:sans-serif;background:#020617;color:white;padding:20px}
input,select{padding:10px;margin:10px;width:250px}
button{padding:10px;background:linear-gradient(135deg,#38bdf8,#9333ea);color:white;border:none}
</style>
</head>
<body>

<h2>🚀 Add App</h2>

<input id="name" placeholder="App Name"><br>
<input id="icon" placeholder="Icon URL"><br>
<select id="category">
<option>tools</option>
<option>games</option>
<option>ai</option>
</select><br>

<button onclick="upload()">Upload App</button>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "PASTE SAME",
  authDomain: "PASTE SAME",
  projectId: "PASTE SAME"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function upload(){
 let name=document.getElementById('name').value;
 let icon=document.getElementById('icon').value;
 let cat=document.getElementById('category').value;

 db.collection("apps").add({
  name:name,
  icon:icon,
  category:cat,
  downloads:0
 }).then(()=>alert("App Uploaded 🚀"));
}
</script>

</body>
</html>
