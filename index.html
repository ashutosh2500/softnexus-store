<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoftNexus MAX</title>

<style>
/* ================= GLOBAL ================= */
*{margin:0;padding:0;box-sizing:border-box}
body{
 font-family:'Segoe UI';
 background:#020617;
 color:white;
 overflow-x:hidden;
 transition:0.3s;
}

/* ================= NAVBAR ================= */
.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:15px 25px;
 backdrop-filter:blur(15px);
 background:rgba(255,255,255,0.05);
 position:sticky;top:0;z-index:1000;
}
.logo{
 font-size:22px;
 font-weight:bold;
 background:linear-gradient(135deg,#38bdf8,#9333ea);
 -webkit-background-clip:text;
 color:transparent;
}
.search{
 width:40%;padding:10px;border-radius:20px;border:none;
 background:rgba(255,255,255,0.1);color:white;
}
.menu-btn{cursor:pointer;font-size:22px}

/* ================= SIDEBAR ================= */
.sidebar{
 position:fixed;right:-260px;top:0;width:260px;height:100%;
 background:rgba(20,20,40,0.9);
 backdrop-filter:blur(20px);
 transition:0.4s;padding:20px;z-index:999;
}
.sidebar.open{right:0}
.sidebar a{display:block;padding:12px;margin:10px 0;border-radius:10px;text-decoration:none;color:white}
.sidebar a:hover{background:linear-gradient(135deg,#38bdf8,#9333ea)}

/* ================= HERO ================= */
.hero{
 margin:20px;padding:40px;border-radius:25px;
 background:linear-gradient(135deg,#0ea5e9,#9333ea);
 animation:fadeIn 1s;
}
.hero h1{font-size:34px}
.hero p{opacity:0.8;margin-top:10px}
.hero button{
 margin-top:15px;padding:10px 20px;border:none;border-radius:12px;
 cursor:pointer;background:white;color:black;font-weight:bold;
}

/* ================= GRID ================= */
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
 gap:20px;padding:20px;
}
.card{
 background:rgba(255,255,255,0.05);
 padding:15px;border-radius:20px;text-align:center;
 transform:scale(0.9);
 opacity:0;
 animation:slideUp 0.5s forwards;
 transition:0.3s;
}
.card:hover{
 transform:scale(1.1) rotateX(5deg);
 box-shadow:0 0 40px rgba(56,189,248,0.6);
}
.icon{
 width:60px;height:60px;margin:auto;margin-bottom:10px;
 border-radius:15px;background:#111;
 display:flex;align-items:center;justify-content:center;font-size:24px;
}
.btn{
 margin-top:10px;padding:8px;border-radius:10px;
 background:linear-gradient(135deg,#38bdf8,#9333ea);
 cursor:pointer;
}

/* ================= POPUP ================= */
.popup{
 position:fixed;top:50%;left:50%;
 transform:translate(-50%,-50%) scale(0);
 background:#111;padding:20px;border-radius:20px;
 z-index:2000;transition:0.3s;width:300px;text-align:center;
}
.popup.active{transform:translate(-50%,-50%) scale(1)}

/* ================= FLOAT BUTTONS ================= */
.ai{
 position:fixed;bottom:20px;left:20px;width:60px;height:60px;
 border-radius:50%;background:linear-gradient(135deg,#38bdf8,#9333ea);
 display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.settings{
 position:fixed;bottom:20px;right:20px;width:60px;height:60px;
 border-radius:50%;background:linear-gradient(135deg,#38bdf8,#9333ea);
 display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* ================= ANIMATIONS ================= */
@keyframes slideUp{
 to{transform:scale(1);opacity:1}
}
@keyframes fadeIn{
 from{opacity:0}to{opacity:1}
}

/* ================= EXTRA ================= */
.badge{
 position:absolute;top:10px;right:10px;
 background:red;padding:3px 8px;border-radius:10px;font-size:12px;
}

</style>
</head>
<body>

<!-- NAVBAR -->
<div class="topbar">
 <div class="logo">🚀 SoftNexus</div>
 <input class="search" id="search" placeholder="Search apps...">
 <div class="menu-btn" onclick="toggleSidebar()">☰</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
 <h2>Menu</h2>
 <a href="#">🏠 Home</a>
 <a href="#">📱 Apps</a>
 <a href="#">🎮 Games</a>
 <a href="#">🤖 AI Tools</a>
 <a href="#">⚙ Settings</a>
</div>

<!-- HERO -->
<div class="hero">
 <h1>SoftNexus App Universe</h1>
 <p>Explore next-gen apps with animations 🚀</p>
 <button onclick="notify('Welcome!')">Explore Now</button>
</div>

<!-- GRID -->
<div class="grid" id="appGrid"></div>

<!-- POPUP -->
<div class="popup" id="popup"></div>

<!-- FLOAT BUTTONS -->
<div class="ai" onclick="ai()">🤖</div>
<div class="settings" onclick="toggleTheme()">⚙</div>

<script>
// ================= DATA =================
let apps=[
{name:"Calculator",icon:"🧮"},
{name:"Notes",icon:"📝"},
{name:"Game Hub",icon:"🎮"},
{name:"AI Chat",icon:"🤖"},
{name:"Editor",icon:"✏"},
{name:"Weather",icon:"☁"},
{name:"Music",icon:"🎵"},
{name:"Video",icon:"🎬"},
{name:"Browser",icon:"🌐"},
{name:"Files",icon:"📁"}
];

let dark=true;

// ================= RENDER =================
function render(list){
 let grid=document.getElementById('appGrid');
 grid.innerHTML="";
 list.forEach((app,i)=>{
  grid.innerHTML+=`<div class="card" style="animation-delay:${i*0.05}s">
   <div class="icon">${app.icon}</div>
   <h3>${app.name}</h3>
   <div class="btn" onclick="openApp('${app.name}')">Open</div>
  </div>`;
 });
}

// ================= APP OPEN =================
function openApp(name){
 let p=document.getElementById('popup');
 p.innerHTML=`<h2>${name}</h2><p>Launching...</p>`;
 p.classList.add('active');
 setTimeout(()=>p.classList.remove('active'),1500);
}

// ================= SEARCH =================
document.getElementById('search').addEventListener('input',e=>{
 let v=e.target.value.toLowerCase();
 render(apps.filter(a=>a.name.toLowerCase().includes(v)));
});

// ================= THEME =================
function toggleTheme(){
 dark=!dark;
 document.body.style.background=dark?"#020617":"#f1f5f9";
 document.body.style.color=dark?"white":"black";
}

// ================= SIDEBAR =================
function toggleSidebar(){
 document.getElementById('sidebar').classList.toggle('open');
}

// ================= AI =================
function ai(){
 notify("AI coming soon 😏");
}

// ================= NOTIFY =================
function notify(msg){
 let p=document.getElementById('popup');
 p.innerHTML=msg;
 p.classList.add('active');
 setTimeout(()=>p.classList.remove('active'),1500);
}

// ================= SCROLL EFFECT =================
window.addEventListener('scroll',()=>{
 document.querySelectorAll('.card').forEach(c=>{
  c.style.transform='scale(1.05)';
 });
});

// INIT
render(apps);
</script>

</body>
</html>
